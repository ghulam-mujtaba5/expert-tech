<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 56" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="et-grad-primary-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#0b1c3d"/>
    </linearGradient>
    <linearGradient id="et-grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2f80ed"/>
      <stop offset="100%" stop-color="#174076"/>
    </linearGradient>
    <filter id="et-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0b1c3d" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Hexagonal Nexus Shield Emblem -->
  <g transform="translate(6, 4)" filter="url(#et-shadow)">
    <!-- Hexagon Outer Boundary -->
    <path d="M24 0 L43 11 L43 37 L24 48 L5 37 L5 11 Z" fill="url(#et-grad-primary-dark)" />
    
    <!-- Stylized 'E' Monogram Path -->
    <path d="M14 15 L26 15 L26 18 L18 18 L18 22.5 L24 22.5 L24 25.5 L18 25.5 L18 30 L26 30 L26 33 L14 33 Z" fill="#ffffff" />
    
    <!-- Stylized 'T' Interlocking Monogram Path -->
    <path d="M22 15 L35 15 L35 18 L30 18 L30 33 L27 33 L27 18 L22 18 Z" fill="#38bdf8" />
    
    <!-- High-Tech Nexus Node -->
    <circle cx="24" cy="24" r="2.5" fill="#ffffff" />
    <circle cx="43" cy="24" r="1.5" fill="#2f80ed" />
    <circle cx="5" cy="24" r="1.5" fill="#2f80ed" />
  </g>

  <!-- Typography & Wordmark -->
  <g transform="translate(64, 0)">
    <!-- "EXPERT" text in Deep Navy -->
    <text x="0" y="27" fill="#0b1c3d" font-family="system-ui, -apple-system, 'Sora', sans-serif" font-size="21" font-weight="800" letter-spacing="0.5">EXPERT</text>
    
    <!-- "TECH" text in Electric Blue -->
    <text x="96" y="27" fill="#2f80ed" font-family="system-ui, -apple-system, 'Sora', sans-serif" font-size="21" font-weight="800" letter-spacing="0.5">TECH</text>
    
    <!-- Subtitle Badge: "MANAGED IT & CLOUD" -->
    <text x="0" y="42" fill="#174076" font-family="system-ui, -apple-system, 'IBM Plex Sans', sans-serif" font-size="8.5" font-weight="600" letter-spacing="2.8">MANAGED IT &amp; CLOUD</text>
    
    <!-- Accent Dot -->
    <circle cx="166" cy="22" r="2" fill="#2f80ed" />
  </g>
</svg>
