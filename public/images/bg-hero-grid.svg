<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" width="100%" height="100%" fill="none">
  <defs>
    <pattern id="hero-grid-pattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12"/>
      <circle cx="60" cy="60" r="1.5" fill="#38bdf8" fill-opacity="0.25"/>
    </pattern>
    <radialGradient id="hero-mask-grad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <mask id="hero-grid-mask">
      <rect width="1440" height="800" fill="url(#hero-mask-grad)"/>
    </mask>
  </defs>

  <rect width="1440" height="800" fill="url(#hero-grid-pattern)" mask="url(#hero-grid-mask)"/>
  
  <!-- Subtle glowing radial ambient orbs -->
  <circle cx="720" cy="200" r="350" fill="#2f80ed" fill-opacity="0.08" filter="blur(80px)"/>
  <circle cx="200" cy="400" r="250" fill="#38bdf8" fill-opacity="0.05" filter="blur(70px)"/>
  <circle cx="1240" cy="350" r="280" fill="#174076" fill-opacity="0.1" filter="blur(90px)"/>
</svg>
